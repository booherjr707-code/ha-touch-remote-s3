;***************************************************;
;   ESP32-S3 DevKitC-1 (N16R8) with                 ;
;               - Hosyond 4.0" 480x320 SPI TFT      ;
;               - ST7796S driver                    ;
;               - XPT2046 resistive touch           ;
;***************************************************;

[env:hosyond-st7796-s3]
extends = arduino_esp32s3_v2, flash_16mb
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
; The Tasmota esptool zip fails to install on PlatformIO 6.2; use the registry one.
platform_packages =
    platformio/tool-esptoolpy @ 1.40501.0

build_flags =
    -D HASP_MODEL="ESP32-S3 Hosyond 4.0 ST7796"
    ${arduino_esp32s3_v2.build_flags}
    ${esp32s3.ps_ram}

;region -- TFT_eSPI build options ------------------------
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D SPI_FREQUENCY=40000000
    -D SUPPORT_TRANSACTIONS
    ${touch.xpt2046}
    ; Display and touch share one SPI bus (the S3's FSPI pins)
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_MISO=13
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=8
    -D TFT_BCKL=7        ; LED pin, so Home Assistant can dim the screen
    -D TOUCH_CS=14
;endregion

lib_deps =
    ${arduino_esp32s3_v2.lib_deps}
    ${tft_espi.lib_deps}
