# Home Assistant settings for the touch remote.
#
# Needs: the Mosquitto broker add-on, and the openHASP integration from HACS.
# Put this in /config/packages/openhasp.yaml and add these two lines to
# configuration.yaml (once):
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# Lines marked CHANGE ME use entity names that depend on your sensors. After the
# 433 MHz receiver and the weather station show up in Home Assistant, look up the
# real names under Settings > Devices & services > Entities, or send them to
# Claude to fill in.
#
# The lightning detector's entities (sensor.lightning_detector_*) already use
# their final names.

# Rain today, from the station's running rain total. Resets at midnight.
utility_meter:
  rain_today:
    source: sensor.weather_station_rain_total        # CHANGE ME
    cycle: daily

openhasp:
  dashboard:   # must match "Plate name" in the remote's MQTT settings
    objects:

      # ---------- Page 1: weather ----------
      - obj: "p1b10"
        properties:
          "text": "{{ states('sensor.weather_station_temperature') | float(0) | round(0) | int }}°"   # CHANGE ME
      - obj: "p1b11"
        properties:
          "text": >-
            {% set t = states('sensor.weather_station_temperature') | float(0) %}
            {% set h = states('sensor.weather_station_humidity') | float(0) %}
            {% set f = t if t < 80 or h < 40 else
               -42.379 + 2.04901523*t + 10.14333127*h - 0.22475541*t*h
               - 0.00683783*t*t - 0.05481717*h*h + 0.00122874*t*t*h
               + 0.00085282*t*h*h - 0.00000199*t*t*h*h %}
            Feels {{ f | round(0) | int }}°
      - obj: "p1b16"
        properties:
          "text": "Humidity {{ states('sensor.weather_station_humidity') | float(0) | round(0) | int }}%"   # CHANGE ME
      - obj: "p1b12"
        properties:
          "text": "Wind {{ states('sensor.weather_station_wind_speed') | float(0) | round(0) | int }} mph"   # CHANGE ME
      - obj: "p1b13"
        properties:
          "text": >-
            {% set d = states('sensor.weather_station_wind_direction') | float(0) %}
            Gust {{ states('sensor.weather_station_wind_gust') | float(0) | round(0) | int }}  from
            {{ ['N','NE','E','SE','S','SW','W','NW'][((d / 45) | round(0) | int) % 8] }}
      - obj: "p1b14"
        properties:
          "text": "Rain today {{ '%.2f' | format(states('sensor.rain_today') | float(0)) }} in"
      - obj: "p1b15"
        properties:
          # The National Weather Service integration's weather entity.
          "text": "{{ states('weather.kjbr') | replace('-', ' ') | replace('partlycloudy', 'partly cloudy') | title }}"   # CHANGE ME

      # ---------- Page 2: driveway and lightning ----------
      - obj: "p2b20"
        properties:
          "text": "{{ 'DRIVEWAY: MOTION!' if is_state('binary_sensor.driveway_alarm_alert', 'on') else 'Driveway: clear' }}"   # CHANGE ME
          "bg_color": "{{ '#D32F2F' if is_state('binary_sensor.driveway_alarm_alert', 'on') else '#2E7D32' }}"
      - obj: "p2b21"
        properties:
          "text": >-
            {% set s = states.binary_sensor.driveway_alarm_alert %}
            Last motion: {{ relative_time(s.last_changed) ~ ' ago' if s else '--' }}
      - obj: "p2b22"
        properties:
          "text": >-
            {% if is_state('binary_sensor.lightning_detector_lightning_nearby', 'on') %}
            Lightning {{ states('sensor.lightning_detector_lightning_distance') | float(0) | round(0) | int }} mi away!
            {% else %}Lightning: none nearby{% endif %}
          "text_color": "{{ '#FF5A5A' if is_state('binary_sensor.lightning_detector_lightning_nearby', 'on') else '#FFFFFF' }}"
      - obj: "p2b23"
        properties:
          "text": >-
            {% set n = states('sensor.lightning_detector_strikes_last_hour') | int(0) %}
            {{ n ~ ' strikes in the last hour, storm ' ~ states('sensor.lightning_detector_storm_trend') if n > 0 else '' }}

      # ---------- Page 3: controls ----------
      # Each button shows whether its device is on, and toggles it when tapped.
      # Change the entity (a light, switch, fan...) and the "text" label.
      - obj: "p3b31"
        properties:
          "text": "Porch"                                              # CHANGE ME
          "val": "{{ 1 if is_state('light.porch', 'on') else 0 }}"     # CHANGE ME
        event:
          "up":
            - service: homeassistant.toggle
              target:
                entity_id: light.porch                                 # CHANGE ME
      - obj: "p3b32"
        properties:
          "text": "Garage"
          "val": "{{ 1 if is_state('light.garage', 'on') else 0 }}"
        event:
          "up":
            - service: homeassistant.toggle
              target:
                entity_id: light.garage
      - obj: "p3b33"
        properties:
          "text": "Living Room"
          "val": "{{ 1 if is_state('light.living_room', 'on') else 0 }}"
        event:
          "up":
            - service: homeassistant.toggle
              target:
                entity_id: light.living_room
      - obj: "p3b34"
        properties:
          "text": "Kitchen"
          "val": "{{ 1 if is_state('light.kitchen', 'on') else 0 }}"
        event:
          "up":
            - service: homeassistant.toggle
              target:
                entity_id: light.kitchen
      - obj: "p3b35"
        properties:
          "text": "Fan"
          "val": "{{ 1 if is_state('fan.bedroom', 'on') else 0 }}"
        event:
          "up":
            - service: homeassistant.toggle
              target:
                entity_id: fan.bedroom
      - obj: "p3b36"
        properties:
          "text": "Outlet"
          "val": "{{ 1 if is_state('switch.outlet', 'on') else 0 }}"
        event:
          "up":
            - service: homeassistant.toggle
              target:
                entity_id: switch.outlet

# Jump to the driveway page when the alarm goes off.
automation:
  - alias: "Touch remote: show driveway alarm"
    trigger:
      - platform: state
        entity_id: binary_sensor.driveway_alarm_alert   # CHANGE ME
        to: "on"
    action:
      - service: openhasp.change_page
        target:
          entity_id: openhasp.dashboard
        data:
          page: 2
